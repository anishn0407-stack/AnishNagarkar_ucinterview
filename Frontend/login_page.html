<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="login_design.css">
</head>
<body>
    <div class="image">
        <img src="image.jpg" class="image_i1" alt="Coffee beans falling">
    </div>
    <div class="hero">
        <h2 class="hero_h2">Central Perk Cafe</h2><br>
        <h1 class="hero_h1">Create Your Account</h1>
        <p>Join our digital living room for the finest brews and cozy moments</p>
        <form class="hero_f1">
            <label class="hero_f1_l1">Full Name</label><br>
            <input type="text" class="hero_f1_i1" placeholder="Phoebe Buffay" required><br>

            <label class="hero_f1_l2">Email Address</label><br>
            <input type="email" class="hero_f1_i2" placeholder="smellycat@centralperk.com" required><br>

            <div class="hero_f1_row">
                <div>
                    <label class="hero_f1_l3">Password</label><br>
                    <input type="password" class="hero_f1_i3" placeholder="........." required>
                </div>
                <div>
                    <label class="hero_f1_l4">Confirm Password</label><br>
                    <input type="password" class="hero_f1_i4" placeholder="..........." required>
                </div>
            </div>

            <input type="checkbox" class="hero_f1_i5" required>
            <label class="hero_f1_l5">I agree to the Terms of Service</label><br>

            <button type="submit" class="hero_f1_i6">Sign Up</button>
        </form>

        <p class="hero_login">Already have an account? <a href="#" class="hero_login_link">Login</a></p>

        <div class="hero_footer">
            <a href="#" class="hero_footer_privacy">Privacy Policy</a>
            <a href="#" class="hero_footer_terms">Terms of Service</a>
            <a href="#" class="hero_footer_accessibility">Accessibility</a>
        </div>
    </div>
</body>
</html>
